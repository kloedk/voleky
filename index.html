<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voleky - Pi Mainnet App</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #ffffff;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
    }

    button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #6f3fa1;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Voleky</h1>
  <p>Pi Mainnet App</p>

  <button id="payButton">Test Payment</button>

  <p id="status"></p>

  <script>
    const status = document.getElementById("status");
    const payButton = document.getElementById("payButton");
let incompletePaymentFound = false;    
    Pi.init({
      version: "2.0",
      sandbox: false
    });

    payButton.addEventListener("click", function () {

      status.innerText = "Starting Pi payment...";

      Pi.authenticate(
        ["username", "payments"],
        function (payment) {
   incompletePaymentFound = true;
          console.log("Incomplete payment:", payment);

    if (
        payment &&
        payment.identifier &&
        payment.transaction &&
        payment.transaction.txid
    ) {
        status.innerText = "Completing incomplete payment...";

        fetch("/.netlify/functions/complete", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                paymentId: payment.identifier,
                txid: payment.transaction.txid
            })
        })
        .then(function (response) {
            return response.json();
        })
        .then(function (data) {
            console.log("Incomplete payment completion response:", data);
            status.innerText = "Incomplete payment completed.";
        })
        .catch(function (error) {
            console.error("Incomplete payment completion error:", error);
            status.innerText = "Incomplete payment completion failed.";
        });
    } else {
        console.log("Incomplete payment has no txid yet:", payment);
    }
}
      ).then(function () {


    if (incompletePaymentFound) {
        return;
    }

    
        Pi.createPayment({
          amount: 0.01,
          memo: "Voleky test payment",
          metadata: {
            app: "Voleky",
            purpose: "Step 10 test transaction"
          }
        }, {

  onReadyForServerApproval: function (paymentId) {
    console.log("Payment ready for server approval:", paymentId);
    status.innerText = "Approving payment...";

    fetch("/.netlify/functions/approve", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            paymentId: paymentId
        })
    })
    .then(function (response) {
        if (!response.ok) {
            throw new Error("Approval failed with status " + response.status);
        }
        return response.json();
    })
    .then(function (data) {
        console.log("Server approval response:", data);
        status.innerText = "Payment approved. Waiting for completion...";
    })
    .catch(function (error) {
        console.error("Approval error:", error);
        status.innerText = "Payment approval failed.";
    });
},

onReadyForServerCompletion: function (paymentId, txid) {
    console.log("Payment ready for server completion:", paymentId, txid);
    status.innerText = "Completing payment...";

    fetch("/.netlify/functions/complete", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            paymentId: paymentId,
            txid: txid
        })
    })
    .then(function (response) {
        if (!response.ok) {
            throw new Error("Completion failed with status " + response.status);
        }
        return response.json();
    })
    .then(function (data) {
        console.log("Server completion response:", data);
        status.innerText = "Payment completed successfully.";
    })
    .catch(function (error) {
        console.error("Completion error:", error);
        status.innerText = "Payment completion failed.";
    });
},

onCancel: function (paymentId) {
    console.log("Payment cancelled:", paymentId);
    status.innerText = "Payment cancelled.";
},

onError: function (error, payment) {
    console.log("Payment error:", error, payment);
    status.innerText = "Payment error.";
}

});

          

      }).catch(function (error) {
        console.error(error);
        status.innerText = "Pi authentication failed.";
      });

    });
  </script>

</body>
</html>
